name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Changeset Status
        if: github.actor != 'dependabot[bot]'
        run: npx --no-install changeset status --since origin/main

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run check:types

      - name: Test devkit harness
        run: npm test

      - name: Build
        run: npm run build

      - name: Doctor
        run: npm run doctor

      - name: Check feature map
        run: npm run check-features

      - name: Verify
        run: npm run verify -- $(node scripts/devkit/print-verify-args.ts) --ci
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
